<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MizChats 💬</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff7043" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MizChats" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, serverTimestamp, update
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4LSVJndP3IL7tQkePCkGACmmojqEvfrM",
      authDomain: "mizyakovchats.firebaseapp.com",
      databaseURL: "https://mizyakovchats-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mizyakovchats",
      storageBucket: "mizyakovchats.firebasestorage.app",
      messagingSenderId: "1050701695700",
      appId: "1:1050701695700:web:f1e813c37bf69bebd34941",
      measurementId: "G-V2WRLPZ46J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window._db = db;
    window._ref = ref;
    window._push = push;
    window._onValue = onValue;
    window._serverTimestamp = serverTimestamp;
    window._update = update;
    window._firebaseReady = true;
    document.dispatchEvent(new Event("firebase-ready"));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Nunito', sans-serif; }

    body {
      background: linear-gradient(160deg, #fff8f0 0%, #ffe0cc 60%, #fff3e0 100%);
      display: flex; flex-direction: column;
    }

    /* ── PASSWORD SCREEN ── */
    #password-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 24px;
    }
    #password-screen .card {
      background: rgba(255,255,255,0.92); border-radius: 28px;
      padding: 40px 28px; text-align: center;
      box-shadow: 0 8px 40px rgba(255,112,67,0.18); width: 100%; max-width: 360px;
    }
    #password-screen .lock { font-size: 64px; margin-bottom: 8px; }
    #password-screen h1 { font-size: 26px; font-weight: 900; color: #2d2d2d; margin-bottom: 6px; }
    #password-screen p { color: #aaa; font-size: 14px; margin-bottom: 24px; }
    #pwd-input {
      width: 100%; border: 2.5px solid #f0e8e0; border-radius: 16px;
      padding: 13px 18px; font-size: 18px; text-align: center;
      outline: none; font-family: inherit; background: #fafafa;
      letter-spacing: 3px; transition: border-color .2s; margin-bottom: 12px;
    }
    #pwd-input:focus { border-color: #ffb89a; }
    #pwd-btn {
      width: 100%; background: #ff7043; color: #fff; border: none;
      border-radius: 16px; padding: 13px; font-size: 16px; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: transform .1s, background .2s;
    }
    #pwd-btn:active { transform: scale(0.97); }
    #pwd-error {
      color: #e53935; font-size: 13px; font-weight: 700;
      margin-top: 10px; min-height: 18px;
    }
    .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #f0e8e0; transition: background .2s;
    }
    .dot.filled { background: #ff7043; }

    /* ── LOGIN ── */
    #login {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 24px;
    }
    #login .card {
      background: rgba(255,255,255,0.92); border-radius: 28px;
      padding: 40px 28px; text-align: center;
      box-shadow: 0 8px 40px rgba(255,112,67,0.18); width: 100%; max-width: 400px;
    }
    #login .house { font-size: 72px; margin-bottom: 8px; }
    #login h1 { font-size: 30px; font-weight: 900; color: #2d2d2d; letter-spacing: -0.5px; margin-bottom: 6px; }
    #login p { color: #aaa; font-size: 15px; margin-bottom: 28px; }
    .member-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .member-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 16px 18px; border-radius: 20px; border: 2.5px solid;
      background: #fff; cursor: pointer; transition: transform .15s, box-shadow .15s;
      min-width: 86px; font-family: inherit;
    }
    .member-btn:active { transform: scale(0.95); }
    .member-btn .em { font-size: 34px; }
    .member-btn .nm { font-size: 13px; font-weight: 800; }

    /* ── APP ── */
    #app { display: none; flex-direction: column; height: 100%; }

    /* Header */
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,200,170,0.4);
      box-shadow: 0 2px 12px rgba(255,112,67,0.08);
      flex-shrink: 0;
    }
    #header .hl { display: flex; align-items: center; gap: 10px; }
    #header .hicon { font-size: 30px; }
    #header .htitle { font-size: 18px; font-weight: 900; color: #2d2d2d; }
    #header .hsub { font-size: 11px; color: #bbb; }
    #header .hr { display: flex; align-items: center; gap: 10px; }
    #header .avatars { display: flex; gap: 2px; font-size: 20px; }
    #switch-btn {
      background: #fff; border: 2px solid #f0e8e0; border-radius: 20px;
      padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
      color: #666; font-family: inherit;
    }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto; padding: 12px 12px 4px;
      display: flex; flex-direction: column; gap: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .date-divider {
      display: flex; justify-content: center; margin: 10px 0 4px;
    }
    .date-label {
      background: rgba(255,255,255,0.75); border-radius: 12px;
      padding: 3px 14px; font-size: 11px; color: #999; font-weight: 700;
    }

    .msg-row { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 2px; }
    .msg-row.me { flex-direction: row-reverse; }

    .sender-emoji { font-size: 26px; flex-shrink: 0; margin-bottom: 4px; }

    .msg-wrap { max-width: 72%; position: relative; }
    .sender-name { font-size: 11px; font-weight: 800; margin-bottom: 3px; margin-left: 4px; }
    .me .sender-name { display: none; }

    .bubble {
      padding: 9px 13px 7px; border-radius: 18px;
      font-size: 15px; line-height: 1.45; word-break: break-word;
      position: relative;
    }
    .bubble .ts {
      font-size: 10px; margin-left: 8px; float: right;
      margin-top: 3px; opacity: 0.65;
    }

    .reactions-row { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
    .me .reactions-row { justify-content: flex-end; }

    .reaction-chip {
      border-radius: 12px; padding: 2px 8px; font-size: 13px;
      cursor: pointer; font-family: inherit; font-weight: 700;
      transition: transform .1s;
    }
    .reaction-chip:active { transform: scale(0.9); }

    .picker {
      position: absolute; bottom: calc(100% + 6px);
      display: flex; gap: 4px; background: #fff;
      border-radius: 16px; padding: 8px 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 20;
      animation: popIn .15s ease;
    }
    .me .picker { right: 0; }
    .picker-btn {
      background: none; border: none; font-size: 22px;
      cursor: pointer; padding: 2px 4px; border-radius: 8px;
    }
    .picker-btn:active { transform: scale(1.2); }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 40px; text-align: center;
    }
    .empty-state .big { font-size: 64px; }
    .empty-state p { color: #bbb; font-size: 16px; font-weight: 700; }

    /* Input */
    #input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,200,170,0.4);
      flex-shrink: 0;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    #my-emoji { font-size: 26px; flex-shrink: 0; }
    #msg-input {
      flex: 1; border: 2px solid #f0e8e0; border-radius: 24px;
      padding: 10px 16px; font-size: 15px; outline: none;
      font-family: inherit; background: #fafafa; color: #2d2d2d;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: #ffb89a; }
    #send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0;
      transition: transform .1s; display: flex; align-items: center; justify-content: center;
    }
    #send-btn:active { transform: scale(0.9); }

    /* Typing indicator */
    .typing { font-size: 12px; color: #bbb; padding: 4px 16px; font-style: italic; }
  </style>
</head>
<body>

<!-- PASSWORD -->
<div id="password-screen">
  <div class="card">
    <div class="lock">🔐</div>
    <h1>MizChats</h1>
    <p>Введи семейный пароль</p>
    <div class="dots" id="dots">
      <div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div>
    </div>
    <input id="pwd-input" type="password" placeholder="••••••" maxlength="20" />
    <button id="pwd-btn">Войти ➤</button>
    <div id="pwd-error"></div>
  </div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="house">🏠</div>
    <h1>MizChats</h1>
    <p>Кто ты сегодня?</p>
    <div class="member-grid" id="member-grid"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="header">
    <div class="hl">
      <span class="hicon">🏠</span>
      <div>
        <div class="htitle">MizChats</div>
        <div class="hsub" id="online-count">семейный чат</div>
      </div>
    </div>
    <div class="hr">
      <div class="avatars" id="avatars-row"></div>
      <button id="switch-btn">сменить</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="input-bar">
    <span id="my-emoji">👨</span>
    <input id="msg-input" type="text" placeholder="Напиши что-нибудь..." />
    <button id="send-btn">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// 🔑 СЕМЕЙНЫЙ ПАРОЛЬ — поменяй на свой!
const FAMILY_PASSWORD = "семья2024";
// ══════════════════════════════════════════

function checkPassword() {
  const input = document.getElementById("pwd-input");
  const error = document.getElementById("pwd-error");
  if (input.value.trim() === FAMILY_PASSWORD) {
    sessionStorage.setItem("family_auth", "1");
    document.getElementById("password-screen").style.display = "none";
    renderLogin();
    document.getElementById("login").style.display = "flex";
    const saved = localStorage.getItem("family_user");
    if (saved) {
      const m = MEMBERS.find(x => x.id === saved);
      if (m) { document.getElementById("login").style.display = "none"; login(m); }
    }
  } else {
    error.textContent = "Неверный пароль 🙈 попробуй ещё раз";
    input.value = "";
    input.focus();
    input.style.borderColor = "#e53935";
    setTimeout(() => { input.style.borderColor = "#f0e8e0"; error.textContent = ""; }, 2200);
  }
}

document.getElementById("pwd-btn").addEventListener("click", checkPassword);
document.getElementById("pwd-input").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});
document.getElementById("pwd-input").addEventListener("input", () => {
  const len = Math.min(document.getElementById("pwd-input").value.length, 4);
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("filled", i < len));
});

const MEMBERS = [
  { id: "papa",   name: "Папа",      emoji: "👨", color: "#4A90D9" },
  { id: "mama",   name: "Мама",      emoji: "👩", color: "#E8749A" },
  { id: "child1", name: "Ребёнок 1", emoji: "🧒", color: "#F5A623" },
  { id: "child2", name: "Ребёнок 2", emoji: "👦", color: "#7ED321" },
  { id: "child3", name: "Ребёнок 3", emoji: "👧", color: "#BD10E0" },
];
const REACTIONS = ["❤️","😂","👍","🔥","😢","🎉"];

let currentUser = null;
let allMessages = {};
let reactionPicker = null;

// ── Helpers ──
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit" });
}
function formatDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if (d.toDateString()===today.toDateString()) return "Сегодня";
  if (d.toDateString()===yest.toDateString()) return "Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
}
function getMember(id) { return MEMBERS.find(m=>m.id===id); }

// ── Render login ──
function renderLogin() {
  const grid = document.getElementById("member-grid");
  grid.innerHTML = "";
  MEMBERS.forEach(m => {
    const btn = document.createElement("button");
    btn.className = "member-btn";
    btn.style.borderColor = m.color;
    btn.innerHTML = `<span class="em">${m.emoji}</span><span class="nm" style="color:${m.color}">${m.name}</span>`;
    btn.onclick = () => login(m);
    grid.appendChild(btn);
  });
}

function login(member) {
  currentUser = member;
  localStorage.setItem("family_user", member.id);
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("my-emoji").textContent = member.emoji;
  document.getElementById("switch-btn").textContent = member.emoji + " " + member.name;
  document.getElementById("send-btn").style.background = member.color;
  document.getElementById("msg-input").placeholder = `Напиши что-нибудь, ${member.name}…`;
  renderAvatars();
  subscribeMessages();
}

function logout() {
  currentUser = null;
  localStorage.removeItem("family_user");
  document.getElementById("app").style.display = "none";
  document.getElementById("login").style.display = "none";
  document.getElementById("password-screen").style.display = "flex";
  document.getElementById("pwd-input").value = "";
  document.querySelectorAll(".dot").forEach(d => d.classList.remove("filled"));
}

function renderAvatars() {
  const row = document.getElementById("avatars-row");
  row.innerHTML = MEMBERS.map(m=>`<span title="${m.name}">${m.emoji}</span>`).join("");
}

// ── Messages ──
function subscribeMessages() {
  if (!window._firebaseReady) {
    document.addEventListener("firebase-ready", subscribeMessages, { once: true });
    return;
  }
  const msgsRef = window._ref(window._db, "messages");
  window._onValue(msgsRef, snapshot => {
    allMessages = snapshot.val() || {};
    renderMessages();
  });
}

function renderMessages() {
  const container = document.getElementById("messages");
  const msgs = Object.entries(allMessages)
    .map(([key,val]) => ({ key, ...val }))
    .sort((a,b) => a.ts - b.ts);

  if (msgs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="big">👨‍👩‍👧‍👦</div>
        <p>Напиши первое сообщение!</p>
      </div>`;
    return;
  }

  let html = "";
  let lastDate = null;

  msgs.forEach(msg => {
    const d = formatDate(msg.ts);
    if (d !== lastDate) {
      html += `<div class="date-divider"><span class="date-label">${d}</span></div>`;
      lastDate = d;
    }

    const sender = getMember(msg.userId);
    const isMe = msg.userId === currentUser?.id;
    const bubbleStyle = isMe
      ? `background:${currentUser.color};color:#fff;border-bottom-right-radius:4px`
      : `background:#fff;color:#2d2d2d;border-bottom-left-radius:4px;box-shadow:0 2px 8px #0000001a`;

    // Reactions
    let reactHtml = "";
    if (msg.reactions) {
      reactHtml = Object.entries(msg.reactions).map(([emoji, users]) => {
        const count = Object.keys(users).length;
        const iMine = users[currentUser?.id];
        const style = iMine
          ? `background:#fff3e0;border:1.5px solid #F5A623`
          : `background:#f5f5f5;border:1.5px solid #e0e0e0`;
        return `<button class="reaction-chip" style="${style}" onclick="toggleReaction('${msg.key}','${emoji}')">${emoji} ${count}</button>`;
      }).join("");
    }

    html += `
      <div class="msg-row ${isMe?"me":""}" id="msg-${msg.key}">
        ${!isMe ? `<span class="sender-emoji">${sender?.emoji||"👤"}</span>` : ""}
        <div class="msg-wrap">
          ${!isMe ? `<div class="sender-name" style="color:${sender?.color}">${sender?.name}</div>` : ""}
          <div class="bubble" style="${bubbleStyle}" ondblclick="showPicker('${msg.key}',event)">
            ${escHtml(msg.text)}
            <span class="ts">${formatTime(msg.ts)}</span>
          </div>
          ${reactHtml ? `<div class="reactions-row">${reactHtml}</div>` : ""}
          ${reactionPicker===msg.key ? renderPicker(msg.key, isMe) : ""}
        </div>
      </div>`;
  });

  const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
  container.innerHTML = html;
  if (wasAtBottom) container.scrollTop = container.scrollHeight;
}

function renderPicker(key, isMe) {
  const btns = REACTIONS.map(r =>
    `<button class="picker-btn" onclick="toggleReaction('${key}','${r}')">${r}</button>`
  ).join("");
  return `<div class="picker" style="${isMe?'right:0':'left:0'}">${btns}</div>`;
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Send ──
async function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !currentUser || !window._firebaseReady) return;

  input.value = "";
  const msgsRef = window._ref(window._db, "messages");
  await window._push(msgsRef, {
    userId: currentUser.id,
    text,
    ts: Date.now(),
    reactions: {}
  });
}

// ── Reactions ──
async function toggleReaction(msgKey, emoji) {
  reactionPicker = null;
  if (!window._firebaseReady || !currentUser) return;
  const path = `messages/${msgKey}/reactions/${emoji}/${currentUser.id}`;
  const r = window._ref(window._db, path);
  const snap = await new Promise(res => window._onValue(r, res, { onlyOnce: true }));
  const updates = {};
  updates[path] = snap.exists() ? null : true;
  await window._update(window._ref(window._db), updates);
}

function showPicker(key, e) {
  e.stopPropagation();
  reactionPicker = reactionPicker === key ? null : key;
  renderMessages();
}

document.addEventListener("click", () => {
  if (reactionPicker) { reactionPicker = null; renderMessages(); }
});

// ── Events ──
document.getElementById("msg-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("switch-btn").addEventListener("click", logout);

// ── Auto-login ──
renderLogin();
if (sessionStorage.getItem("family_auth") === "1") {
  document.getElementById("password-screen").style.display = "none";
  const saved = localStorage.getItem("family_user");
  if (saved) {
    const m = MEMBERS.find(x => x.id === saved);
    if (m) login(m);
    else document.getElementById("login").style.display = "flex";
  } else {
    document.getElementById("login").style.display = "flex";
  }
}

// ── Service Worker ──
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
