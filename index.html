</div>

let MEMBERS = [
  { id:"papa",   name:"Папа",  emoji:"👨", color:"#1a73e8" },
  { id:"mama",   name:"Мама",  emoji:"👩", color:"#e91e8c" },
  { id:"child1", name:"Ясин",  emoji:"🧒", color:"#f57c00" },
  { id:"child2", name:"Иса",   emoji:"👦", color:"#2e7d32" },
  { id:"child3", name:"Ребёнок 3", emoji:"👧", color:"#7b1fa2" },
];

let currentUser = null;
let currentChatId = null;
let unsubscribe = null;
let allMessages = {};
let reactionPicker = null;
let lastMessages = {};
let unreadCounts = {};
let selectedDay = null;

function show(id) {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function getMember(id) { return MEMBERS.find(m=>m.id===id)||{name:"?",emoji:"👤",color:"#aaa"}; }
function formatTime(ts) { return new Date(ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
function formatDate(ts) {
  const d=new Date(ts),today=new Date(),yest=new Date();
  yest.setDate(yest.getDate()-1);
  if(d.toDateString()===today.toDateString()) return "Сегодня";
  if(d.toDateString()===yest.toDateString()) return "Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
}
function chatIdForDM(a,b) { return [a,b].sort().join("_"); }
function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function loadSavedNames() {
  const saved=localStorage.getItem("miz_names");
  if(saved) { JSON.parse(saved).forEach(s=>{ const m=MEMBERS.find(x=>x.id===s.id); if(m){m.name=s.name;m.emoji=s.emoji;} }); }
}
// ── Avatars ──
let avatars = {}; // memberId -> base64 string
let newAvatarBase64 = null;

function loadAvatars() {
  if(!window._firebaseReady){ document.addEventListener("firebase-ready",loadAvatars,{once:true}); return; }
  window._onValue(window._ref(window._db,"avatars"), snap=>{
    avatars = snap.val() || {};
    refreshAllAvatars();
  });
}

function refreshAllAvatars() {
  // Update list header
  if(currentUser) updateMyAvatarUI();
  renderChatList();
}

function updateMyAvatarUI() {
  const av = avatars[currentUser.id];
  const badge = document.getElementById("list-my-emoji");
  if(av) {
    badge.innerHTML = `<img src="${av}" class="member-avatar-sm" />`;
  } else {
    badge.textContent = currentUser.emoji;
  }
}

function getMemberAvatar(id, size=28) {
  const av = avatars[id];
  const m = getMember(id);
  if(av) return `<img src="${av}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;" />`;
  return `<span style="font-size:${size*0.7}px">${m.emoji}</span>`;
}

function handleAvatarChange(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    // Compress image
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 200;
      let w = img.width, h = img.height;
      if(w > h) { if(w>MAX){h=h*MAX/w;w=MAX;} } else { if(h>MAX){w=w*MAX/h;h=MAX;} }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      newAvatarBase64 = canvas.toDataURL('image/jpeg', 0.7);
      // Show preview
      const preview = document.getElementById("settings-avatar-preview");
      preview.innerHTML = `<img src="${newAvatarBase64}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;" />`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveAvatar() {
  if(!newAvatarBase64 || !window._firebaseReady) return;
  const updates = {};
  updates[`avatars/${currentUser.id}`] = newAvatarBase64;
  await window._update(window._ref(window._db), updates);
  newAvatarBase64 = null;
}

function saveNames() {
  localStorage.setItem("miz_names",JSON.stringify(MEMBERS.map(m=>({id:m.id,name:m.name,emoji:m.emoji}))));
}

// ── Password ──
document.getElementById("pwd-btn").onclick=checkPassword;
document.getElementById("pwd-input").onkeydown=e=>{if(e.key==="Enter")checkPassword();};
document.getElementById("pwd-input").oninput=()=>{
  const len=Math.min(document.getElementById("pwd-input").value.length,4);
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("filled",i<len));
};
function checkPassword(){
  const val=document.getElementById("pwd-input").value.trim();
  const err=document.getElementById("pwd-error");
  if(val===FAMILY_PASSWORD){
    sessionStorage.setItem("miz_auth","1");
    document.getElementById("pwd-input").value="";
    document.querySelectorAll(".dot").forEach(d=>d.classList.remove("filled"));
    loadSavedNames();
    const saved=localStorage.getItem("miz_user");
    if(saved){const m=MEMBERS.find(x=>x.id===saved);if(m){loginAs(m);return;}}
    renderLoginScreen(); show("login-screen");
  } else {
    err.textContent="Неверный пароль 🙈";
    document.getElementById("pwd-input").value="";
    document.getElementById("pwd-input").style.borderColor="#e53935";
    setTimeout(()=>{document.getElementById("pwd-input").style.borderColor="#e0e7ff";err.textContent="";},2000);
  }
}

// ── Login ──
function renderLoginScreen(){
  const grid=document.getElementById("member-grid");
  grid.innerHTML="";
  MEMBERS.forEach(m=>{
    const btn=document.createElement("button");
    btn.className="member-btn";
    btn.style.borderColor=m.color;
    btn.innerHTML=`<span class="em">${m.emoji}</span><span class="nm" style="color:${m.color}">${m.name}</span>`;
    btn.onclick=()=>loginAs(m);
    grid.appendChild(btn);
  });
}
function loginAs(member){
  currentUser=MEMBERS.find(m=>m.id===member.id);
  localStorage.setItem("miz_user",currentUser.id);
  document.getElementById("list-my-emoji").textContent=currentUser.emoji;
  document.getElementById("list-my-name").textContent=currentUser.name;
  document.getElementById("my-emoji-bar").textContent=currentUser.emoji;
  document.getElementById("send-btn").style.background=`linear-gradient(135deg,${currentUser.color},${currentUser.color}cc)`;
  subscribeLastMessages();
  loadAvatars();
  show("list-screen");
}

document.getElementById("logout-btn").onclick=()=>{
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  currentUser=null;currentChatId=null;
  localStorage.removeItem("miz_user");
  document.getElementById("pwd-input").value="";
  document.querySelectorAll(".dot").forEach(d=>d.classList.remove("filled"));
  show("pwd-screen");
};

// ── Chat List ──
function subscribeLastMessages(){
  if(!window._firebaseReady){document.addEventListener("firebase-ready",subscribeLastMessages,{once:true});return;}
  window._onValue(window._ref(window._db,"chats"),snap=>{
    lastMessages={};unreadCounts={};
    const data=snap.val()||{};
    Object.entries(data).forEach(([chatId,msgs])=>{
      const arr=Object.entries(msgs).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts);
      if(arr.length>0) lastMessages[chatId]=arr[arr.length-1];
      const lastSeen=parseInt(localStorage.getItem("seen_"+chatId+"_"+currentUser.id)||"0");
      unreadCounts[chatId]=arr.filter(m=>m.userId!==currentUser.id&&m.ts>lastSeen).length;
    });
    renderChatList();
  });
}

function renderChatList(){
  const el=document.getElementById("chat-list");
  let html="";
  const groupLast=lastMessages["group"];
  const groupUnread=unreadCounts["group"]||0;
  const groupPreview=groupLast?`${getMember(groupLast.userId).emoji} ${escHtml(groupLast.text)}`:"Напишите первое сообщение!";
  html+=`<div class="section-label">ЧАТЫ</div>`;
  html+=`<div class="chat-item" onclick="openChat('group')">
    <div class="chat-avatar">👨‍👩‍👧‍👦</div>
    <div class="chat-info">
      <div class="chat-name">Вся семья</div>
      <div class="chat-preview">${groupPreview}</div>
    </div>
    <div class="chat-meta">
      <span class="chat-time">${groupLast?formatTime(groupLast.ts):""}</span>
      ${groupUnread>0?`<span class="chat-badge">${groupUnread}</span>`:""}
    </div>
  </div>`;
  const others=MEMBERS.filter(m=>m.id!==currentUser.id);
  others.forEach(m=>{
    const cid=chatIdForDM(currentUser.id,m.id);
    const last=lastMessages[cid];
    const unread=unreadCounts[cid]||0;
    const preview=last?(last.userId===currentUser.id?`Ты: ${escHtml(last.text)}`:escHtml(last.text)):"Начни общение...";
    html+=`<div class="chat-item" onclick="openChat('${cid}','${m.id}')">
      <div class="chat-avatar">${m.emoji}</div>
      <div class="chat-info">
        <div class="chat-name">${m.name}</div>
        <div class="chat-preview">${preview}</div>
      </div>
      <div class="chat-meta">
        <span class="chat-time">${last?formatTime(last.ts):""}</span>
        ${unread>0?`<span class="chat-badge">${unread}</span>`:""}
      </div>
    </div>`;
  });
  html+=`<div class="section-label" style="margin-top:8px;">РАСПИСАНИЯ УРОКОВ</div>`;
  html+=`<div class="chat-item schedule-item" onclick="openSchedule('yasin')">
    <div class="chat-avatar">🎒</div>
    <div class="chat-info">
      <div class="chat-name">📚 Расписание уроков Ясин</div>
      <div class="chat-preview">5 Г класс • расписание уроков</div>
    </div>
    <div class="chat-meta"><span style="font-size:20px;">›</span></div>
  </div>`;
  html+=`<div class="chat-item schedule-item" onclick="openSchedule('ise')">
    <div class="chat-avatar">🎒</div>
    <div class="chat-info">
      <div class="chat-name">📚 Расписание уроков Иса</div>
      <div class="chat-preview">Расписание будет добавлено скоро</div>
    </div>
    <div class="chat-meta"><span style="font-size:20px;">›</span></div>
  </div>`;
  el.innerHTML=html;
}

// ── Open Chat ──
function openChat(chatId,partnerId){
  currentChatId=chatId;reactionPicker=null;
  localStorage.setItem("seen_"+chatId+"_"+currentUser.id,Date.now().toString());
  if(chatId==="group"){
    document.getElementById("chat-avatar").textContent="👨‍👩‍👧‍👦";
    document.getElementById("chat-name").textContent="Вся семья";
    document.getElementById("chat-sub").textContent="общий чат • "+MEMBERS.length+" участников";
  } else {
    const p=getMember(partnerId);
    document.getElementById("chat-avatar").textContent=p.emoji;
    document.getElementById("chat-name").textContent=p.name;
    document.getElementById("chat-sub").textContent="личный чат";
  }
  document.getElementById("my-emoji-bar").textContent=currentUser.emoji;
  show("chat-screen");
  subscribeChat(chatId);
}

document.getElementById("back-btn").onclick=()=>{
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  localStorage.setItem("seen_"+currentChatId+"_"+currentUser.id,Date.now().toString());
  currentChatId=null;show("list-screen");
};

function subscribeChat(chatId){
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  if(!window._firebaseReady){document.addEventListener("firebase-ready",()=>subscribeChat(chatId),{once:true});return;}
  const off=window._onValue(window._ref(window._db,"chats/"+chatId),snap=>{
    allMessages=snap.val()||{};renderMessages();
  });
  unsubscribe=()=>off();
}

function renderMessages(){
  const container=document.getElementById("messages");
  const msgs=Object.entries(allMessages).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts);
  if(msgs.length===0){
    container.innerHTML=`<div class="empty-state"><div class="big">💬</div><p>Напиши первое сообщение!</p></div>`;
    return;
  }
  let html="",lastDate=null;
  msgs.forEach(msg=>{
    const d=formatDate(msg.ts);
    if(d!==lastDate){html+=`<div class="date-div"><span class="date-lbl">${d}</span></div>`;lastDate=d;}
    const sender=getMember(msg.userId);
    const isMe=msg.userId===currentUser.id;
    const bubbleStyle=isMe
      ?`background:${currentUser.color};color:#fff;border-bottom-right-radius:4px`
      :`background:#fff;color:#1a1a2e;border-bottom-left-radius:4px;box-shadow:0 2px 8px #0000001a`;
    let reactHtml="";
    if(msg.reactions){
      reactHtml=Object.entries(msg.reactions).map(([emoji,users])=>{
        const count=Object.keys(users).length;
        const mine=users[currentUser.id];
        const style=mine?`background:#e8f0fe;border:1.5px solid #1a73e8`:`background:#f5f5f5;border:1.5px solid #e0e0e0`;
        return `<button class="reaction-chip" style="${style}" onclick="toggleReaction('${msg.key}','${emoji}')">${emoji} ${count}</button>`;
      }).join("");
    }
    html+=`<div class="msg-row ${isMe?"me":""}" id="msg-${msg.key}">
      ${!isMe?`<div style="flex-shrink:0;margin-bottom:4px;">${getMemberAvatar(msg.userId,28)}</div>`:""}
      <div class="msg-wrap">
        ${!isMe&&currentChatId==="group"?`<div class="sender-nm" style="color:${sender.color}">${sender.name}</div>`:""}
        <div class="bubble" style="${bubbleStyle}" ondblclick="showPicker('${msg.key}',event)">
          ${escHtml(msg.text)}<span class="ts">${formatTime(msg.ts)}${isMe?` <span style="opacity:0.8">${getReadStatus(msg)}</span>`:""}</span>
        </div>
        ${reactHtml?`<div class="reactions-row">${reactHtml}</div>`:""}
        ${reactionPicker===msg.key?renderPicker(msg.key,isMe):""}
      </div>
    </div>`;
  });
  const wasAtBottom=container.scrollHeight-container.scrollTop-container.clientHeight<80;
  container.innerHTML=html;
  if(wasAtBottom) container.scrollTop=container.scrollHeight;
}

function getReadStatus(msg) {
  // Check if any other member has seen this chat after msg.ts
  const others = MEMBERS.filter(m => m.id !== currentUser.id);
  const readByAny = others.some(m => {
    const seen = parseInt(localStorage.getItem("seen_" + currentChatId + "_" + m.id) || "0");
    return seen >= msg.ts;
  });
  return readByAny ? "✓✓" : "✓";
}

function renderPicker(key,isMe){
  return `<div class="picker" style="${isMe?"right:0":"left:0"}">${REACTIONS.map(r=>`<button class="picker-btn" onclick="toggleReaction('${key}','${r}')">${r}</button>`).join("")}</div>`;
}
function showPicker(key,e){e.stopPropagation();reactionPicker=reactionPicker===key?null:key;renderMessages();}
document.addEventListener("click",()=>{if(reactionPicker){reactionPicker=null;renderMessages();}});

async function sendMessage(){
  const input=document.getElementById("msg-input");
  const text=input.value.trim();
  if(!text||!currentUser||!currentChatId||!window._firebaseReady) return;
  input.value="";
  await window._push(window._ref(window._db,"chats/"+currentChatId),{userId:currentUser.id,text,ts:Date.now(),reactions:{}});
}
document.getElementById("send-btn").onclick=sendMessage;
document.getElementById("msg-input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}};

async function toggleReaction(msgKey,emoji){
  reactionPicker=null;
  if(!window._firebaseReady||!currentUser||!currentChatId) return;
  const path=`chats/${currentChatId}/${msgKey}/reactions/${emoji}/${currentUser.id}`;
  const r=window._ref(window._db,path);
  const snap=await new Promise(res=>window._onValue(r,res,{onlyOnce:true}));
  const updates={};updates[path]=snap.exists()?null:true;
  await window._update(window._ref(window._db),updates);
}

// ── Schedule ──
let currentScheduleChild = 'yasin';

function openSchedule(child){
  currentScheduleChild = child || 'yasin';
  const today=new Date().getDay();
  const dayMap={1:"Пн",2:"Вт",3:"Ср",4:"Чт",5:"Пт"};
  selectedDay=dayMap[today]||"Пн";
  const name = currentScheduleChild === 'yasin' ? 'Ясина' : 'Исы';
  document.querySelector('#schedule-screen .chat-header-name').textContent = `📚 Уроки ${name}`;
  document.querySelector('#schedule-screen .chat-header-sub').textContent = currentScheduleChild === 'yasin' ? '5 Г класс • 2024-2025' : 'Расписание уроков';
  renderDaysBar();
  renderLessons();
  show("schedule-screen");
}

document.getElementById("sched-back-btn").onclick=()=>show("list-screen");

function renderDaysBar(){
  const bar=document.getElementById("days-bar");
  bar.innerHTML=DAYS.map(d=>`<button class="day-btn${d===selectedDay?" active":""}" onclick="selectDay('${d}')">${d}</button>`).join("");
}

function selectDay(day){
  selectedDay=day;
  renderDaysBar();
  renderLessons();
}

function renderLessons(){
  const list=document.getElementById("lessons-list");
  const sched = currentScheduleChild === 'yasin' ? SCHEDULE : SCHEDULE_ISE;
  const lessons=sched[selectedDay]||[];
  if(lessons.length===0){
    const msg = currentScheduleChild === 'ise' ? '📝 Расписание Исе будет добавлено скоро' : '🎉 Нет уроков!';
    list.innerHTML=`<div class="no-lessons">${msg}</div>`;
    return;
  }
  list.innerHTML=lessons.map((l,i)=>`
    <div class="lesson-card">
      <div class="lesson-num">Урок ${i+1}</div>
      <div class="lesson-subject">${l.subject}</div>
      <div class="lesson-time">🕐 ${l.time}</div>
      <div class="lesson-room">📍 ${l.room}</div>
    </div>
  `).join("");
}

// ── Settings ──
let settingsEmoji=null;
document.getElementById("settings-btn").onclick=openSettings;
document.getElementById("settings-cancel").onclick=()=>document.getElementById("settings-modal").classList.remove("open");
document.getElementById("settings-modal").onclick=e=>{if(e.target===document.getElementById("settings-modal"))document.getElementById("settings-modal").classList.remove("open");};
document.getElementById("settings-save").onclick=saveSettings;

function openSettings(){
  settingsEmoji=currentUser.emoji;
  newAvatarBase64=null;
  document.getElementById("settings-name").value=currentUser.name;
  // Show current avatar
  const preview = document.getElementById("settings-avatar-preview");
  const av = avatars[currentUser.id];
  if(av) {
    preview.innerHTML=`<img src="${av}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;" />`;
  } else {
    preview.className="avatar-emoji";
    preview.textContent=currentUser.emoji;
  }
  document.getElementById("emoji-grid").innerHTML=EMOJI_OPTIONS.map(e=>`<button class="emoji-opt${e===settingsEmoji?" selected":""}" onclick="selectEmoji('${e}')">${e}</button>`).join("");
  document.getElementById("settings-modal").classList.add("open");
}
function selectEmoji(e){
  settingsEmoji=e;
  document.querySelectorAll(".emoji-opt").forEach(b=>b.classList.toggle("selected",b.textContent===e));
}
function saveSettings(){
  const name=document.getElementById("settings-name").value.trim();
  if(!name) return;
  const m=MEMBERS.find(x=>x.id===currentUser.id);
  if(m){m.name=name;m.emoji=settingsEmoji||currentUser.emoji;}
  currentUser={...currentUser,name,emoji:settingsEmoji||currentUser.emoji};
  saveNames();
  saveAvatar(); // save avatar to Firebase
  updateMyAvatarUI();
  document.getElementById("list-my-name").textContent=currentUser.name;
  document.getElementById("my-emoji-bar").textContent=currentUser.emoji;
  document.getElementById("settings-modal").classList.remove("open");
  renderChatList();
}

// ── Boot ──
loadSavedNames();
if(sessionStorage.getItem("miz_auth")==="1"){
  const saved=localStorage.getItem("miz_user");
  if(saved){const m=MEMBERS.find(x=>x.id===saved);if(m){loginAs(m);}else{renderLoginScreen();show("login-screen");}}
  else{renderLoginScreen();show("login-screen");}
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
